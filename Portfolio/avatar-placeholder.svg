<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fbd38d" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" fill="url(#bgGrad)" />

  <!-- Subtle glow ring -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-dasharray="12 8" opacity="0.6" />

  <!-- Shoulders / Hoodie Body -->
  <path d="M 90 380 C 100 290, 150 260, 200 260 C 250 260, 300 290, 310 380 Z" fill="#334155" />
  <!-- Hoodie Zipper / Accent -->
  <path d="M 200 260 L 200 380" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round" />
  <path d="M 160 380 L 175 295 L 200 310 L 225 295 L 240 380 Z" fill="#1e293b" opacity="0.6" />

  <!-- Head & Neck -->
  <rect x="180" y="220" width="40" height="50" rx="8" fill="url(#skinGrad)" />
  <ellipse cx="200" cy="180" rx="65" ry="75" fill="url(#skinGrad)" />

  <!-- Hair -->
  <path d="M 130 175 C 130 110, 160 95, 200 95 C 240 95, 270 110, 270 175 C 270 140, 250 120, 200 120 C 150 120, 135 140, 130 175 Z" fill="#0f172a" />
  <!-- Stylish hair bangs -->
  <path d="M 135 150 C 155 125, 190 125, 205 140 C 220 125, 255 130, 265 155 C 250 135, 215 135, 200 148 C 185 135, 150 135, 135 150 Z" fill="#1e293b" />

  <!-- Glasses -->
  <rect x="150" y="165" width="42" height="28" rx="8" fill="none" stroke="#38bdf8" stroke-width="4" />
  <rect x="208" y="165" width="42" height="28" rx="8" fill="none" stroke="#38bdf8" stroke-width="4" />
  <line x1="192" y1="179" x2="208" y2="179" stroke="#38bdf8" stroke-width="4" />
  <line x1="135" y1="175" x2="150" y2="175" stroke="#38bdf8" stroke-width="4" />
  <line x1="250" y1="175" x2="265" y2="175" stroke="#38bdf8" stroke-width="4" />

  <!-- Friendly Smile -->
  <path d="M 185 215 Q 200 230 215 215" fill="none" stroke="#9a3412" stroke-width="3" stroke-linecap="round" />

  <!-- Floating Tech / Sport Icons -->
  <!-- Code bracket badge -->
  <g transform="translate(45, 100)">
    <circle cx="25" cy="25" r="24" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <text x="25" y="32" font-family="monospace" font-size="18" font-weight="bold" fill="#38bdf8" text-anchor="middle">&lt;/&gt;</text>
  </g>

  <!-- Trophy / Sports badge -->
  <g transform="translate(305, 100)">
    <circle cx="25" cy="25" r="24" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
    <text x="25" y="33" font-size="20" text-anchor="middle">🏆</text>
  </g>
</svg>
